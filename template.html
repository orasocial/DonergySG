<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAF7F2;--card:#fff;--red:#C82025;--gold:#C49A45;--ink:#242424;--mut:#67615C;--line:#E7DFD3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 Poppins,system-ui,sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}a{color:inherit}:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:flex-end;padding:18px 0}
.brand{font:400 42px/1 Anton,Impact,sans-serif;margin:0}.brand span{color:var(--red)}.sub{margin:4px 0 0;color:var(--mut)}.upd{font-size:13px;color:var(--mut);text-align:right;margin:0}.upd b{color:var(--ink)}

button{font:500 14px Poppins,sans-serif;cursor:pointer;color:var(--ink)}

.st ul{margin:8px 0 0;padding:0;list-style:none}.st li{padding:4px 0;border-top:1px solid var(--line)}.bad{color:var(--red);font-weight:600}
.carw{position:relative}.occ{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 12px;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:thin}

.chip{display:inline-block;font-size:11px;font-weight:600;padding:1px 9px;border-radius:99px;border:1px solid var(--gold);width:fit-content}.chip.s{background:var(--red);border-color:var(--red);color:#fff}.chip.g{background:#FFF6DD}
.dleft{font:400 22px Anton,Impact,sans-serif;color:var(--red)}.o .acts{margin-top:auto;display:flex;gap:10px;font-size:13px}.lk{background:none;border:0;padding:0;color:var(--red);font-size:13px;text-decoration:underline}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0 14px}.bar input{flex:1 1 240px;padding:10px 14px;border:1px solid var(--line);border-radius:99px;font:inherit;background:#fff}
.f{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}.f .sep{width:1px;background:var(--line);margin:0 4px}
.f button,.sv{padding:7px 14px;border:1px solid var(--line);background:#fff;border-radius:99px}.f button:hover,.sv:hover{border-color:var(--red)}
[aria-pressed=true].fb,.sv[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff}.fb.os[aria-pressed=false]{border-style:dashed}
.feat{display:grid;grid-template-columns:200px 1fr;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:18px}
.feat .tx{padding:16px 20px;display:flex;flex-direction:column;gap:6px}.feat h3{font:600 20px/1.3 Poppins;margin:0}
.feat>img,.feat>.ph{height:100%;min-height:140px;width:100%;object-fit:cover}
.trow .card{flex:0 0 250px;scroll-snap-align:start}.trow .card h3{font-size:14.5px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{position:relative;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}.card:hover{border-color:var(--red)}
.card>img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.ph{display:flex;align-items:center;gap:10px;padding:0 14px;height:44px;font:400 15px Anton,Impact,sans-serif;letter-spacing:.5px;color:var(--red);background:repeating-linear-gradient(135deg,#FFF3E6 0 10px,#FBE9D2 10px 20px);border-bottom:1px solid var(--line)}
.feat .ph{height:100%;min-height:100px;justify-content:center;border:0}.ph i{width:10px;height:10px;border-radius:50%;background:var(--gold)}
.card .tx{padding:12px 16px 14px;display:flex;flex-direction:column;gap:7px;flex:1}.card h3{font:600 16px/1.35 Poppins;margin:0;padding-right:30px}
.meta{font-size:12.5px;color:var(--mut)}.tags{display:flex;flex-wrap:wrap;gap:6px}
.wm{font-size:13.5px;border-left:3px solid var(--gold);padding-left:9px}.wm b{font-weight:600}
.idea{font-size:13.5px;background:#FFF6DD;border-radius:8px;padding:7px 10px}.idea b{color:var(--red);font-weight:600}.idea em{color:var(--mut);font-size:12px}
.rel{font-size:13px}.rel summary{cursor:pointer;color:var(--mut)}.rel a{display:block;padding:2px 0}
.rd{margin-top:auto;font-weight:600;font-size:14px;color:var(--red);text-decoration:none}.rd:hover{text-decoration:underline}
.bm{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:17px;line-height:1}.bm[aria-pressed=true]{background:var(--red);color:#fff;border-color:var(--red)}
.state{padding:36px 20px;text-align:center;color:var(--mut);background:#fff;border:1px dashed var(--line);border-radius:12px;grid-column:1/-1}
.more{display:block;margin:20px auto;padding:9px 24px;border:1px solid var(--red);color:var(--red);background:#fff;border-radius:99px}.more[hidden]{display:none}
dialog{border:1px solid var(--line);border-radius:14px;padding:20px;max-width:380px;width:92%}dialog::backdrop{background:rgba(0,0,0,.35)}
dialog label{display:block;font-size:13px;margin:10px 0 2px;font-weight:500}dialog input,dialog textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit}dialog .r{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
footer{text-align:center;color:var(--mut);font-size:13px;padding:26px 20px}
@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.grid{grid-template-columns:1fr}.brand{font-size:34px}.upd{text-align:left}.feat{grid-template-columns:1fr}.feat>img{height:150px}.feat .ph{min-height:44px}.o{flex-basis:78%}.trow .card{flex-basis:80%}.nav button{width:32px;height:32px}}
</style></head><body>
<header><div class="wrap top"><div><h1 class="brand">DONERGY <span>DAILY</span></h1><p class="sub" id="sub"></p></div><p class="upd" id="upd"></p></div></header>
<main class="wrap">
<div id="warn"></div><details class="st" id="st"></details>
<div class="h2r"><h2>Upcoming occasions</h2><div class="nav"><button class="btn p" id="addo" style="width:auto;border-radius:99px;font-size:13px;padding:0 12px">+ Add</button><button id="pv" aria-label="Previous occasions">‹</button><button id="nx" aria-label="Next occasions">›</button></div></div>
<div class="occ" id="occ" tabindex="0" aria-label="Upcoming occasions. Use arrow keys to scroll"></div>
<div id="featbox"></div>
<div class="h2r"><h2>Trends &amp; memes</h2><div class="nav"><button id="tp" aria-label="Previous trends">‹</button><button id="tn" aria-label="Next trends">›</button></div></div>
<div class="occ trow" id="trow" tabindex="0" aria-label="Trends and memes. Use arrow keys to scroll"></div>
<h2>Latest stories</h2>
<div class="bar"><label for="q" style="position:absolute;left:-9999px">Search stories</label><input id="q" type="search" placeholder="Search stories or publishers"><button class="sv" id="sv" aria-pressed="false"></button></div>
<div class="f" id="f" role="group" aria-label="Filter stories"></div>
<div id="grid" class="grid"><p class="state">Loading stories…</p></div>
<button class="more" id="more" hidden>Show more</button>
</main>
<footer id="foot"></footer>
<dialog id="dlg"><form method="dialog" id="fm"><h3 style="margin:0;font:400 20px Anton">Occasion</h3>
<label for="on">Name</label><input id="on" required maxlength="60"><label for="od">Date</label><input id="od" type="date" required>
<label for="ot">Planning note</label><textarea id="ot" rows="3" maxlength="200"></textarea>
<label><input type="checkbox" id="oy" style="width:auto"> Repeats every year</label><label><input type="checkbox" id="oc" style="width:auto"> Date is confirmed</label>
<div class="r"><button type="button" class="btn" id="oq">Cancel</button><button class="btn p" id="os">Save</button></div></form></dialog>
<script id="data" type="application/json">__DATA__</script>
<script>
(function(){
var $=function(s){return document.querySelector(s)};
function h(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
var D;try{D=JSON.parse($('#data').textContent)}catch(e){$('#grid').innerHTML='<p class="state">Sorry, the story data could not be loaded.</p>';return}
var TZ='Asia/Singapore',S={q:'',cat:'All',saved:false,n:30},SAVED={},OC={custom:[],edits:{},removed:[]};
try{SAVED=JSON.parse(localStorage.getItem('dd_saved')||'{}')}catch(e){}
try{OC=Object.assign(OC,JSON.parse(localStorage.getItem('dd_occ')||'{}'))}catch(e){}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function fd(i,o){return new Date(i).toLocaleDateString('en-SG',Object.assign({day:'numeric',month:'short',year:'numeric',timeZone:TZ},o||{}))}
function ft(i){return new Date(i).toLocaleString('en-SG',{dateStyle:'medium',timeStyle:'short',timeZone:TZ})+' SGT'}
$('#sub').textContent=D.cfg.subtitle;
var up=D.updated?Date.parse(D.updated):0;
$('#upd').innerHTML=up?'Stories last updated · checked hourly<br><b>'+ft(up)+'</b>':'Not refreshed yet';
var w=$('#warn'),bad=(D.sources||[]).filter(function(s){return!s.ok});
if(!up||Date.now()-up>18*36e5)w.appendChild(h('div','warn','Showing cached stories. The feed has not refreshed since '+(up?ft(up):'it was set up')+'. Article dates show when each story was published.'));
else if(D.failed>0)w.appendChild(h('div','warn',D.failed+' of '+(D.sources||[]).length+' sources failed in the latest refresh. Their cached stories are marked "Cached" and the rest are up to date.'));
var st=$('#st');st.appendChild(h('summary',0,'Source status: '+D.ok+' OK, '+D.failed+' failed'));var ul=h('ul');
(D.sources||[]).slice().sort(function(a,b){return a.ok-b.ok}).forEach(function(s){var li=h('li');
 li.appendChild(h('span',s.ok?'':'bad',(s.ok?'OK  ':'Failed  ')+s.n));
 if(!s.ok)li.appendChild(h('span',0,' · '+(s.why||'No reason given')+(s.lastOk?' · showing cached stories from '+ft(s.lastOk):'')));ul.appendChild(li)});st.appendChild(ul);if(bad.length)st.open=true;
/* ---- occasions ---- */
var oc=$('#occ');
function today(){return Date.parse(new Date().toLocaleDateString('en-CA',{timeZone:TZ})+'T00:00:00+08:00')}
function nextDate(o){var d=o.date;if(!d&&o.md){var y=new Date(today()+288e5).getUTCFullYear();d=y+'-'+o.md;if(Date.parse(d+'T00:00:00+08:00')<today())d=(y+1)+'-'+o.md}
 if(!d)return null;var t=Date.parse(d+'T00:00:00+08:00');
 if(t<today()&&(o.yearly)){var p=d.slice(5),y2=new Date(today()+288e5).getUTCFullYear();d=y2+'-'+p;if(Date.parse(d+'T00:00:00+08:00')<today())d=(y2+1)+'-'+p;t=Date.parse(d+'T00:00:00+08:00')}
 return t<today()?null:{d:d,t:t}}
var dlgO=null;
function drawOcc(){oc.innerHTML='';var all=D.occasions.filter(function(o){return OC.removed.indexOf(o.id)<0}).map(function(o){return Object.assign({},o,OC.edits[o.id]||{})}).concat(OC.custom.map(function(o){return Object.assign({tag:'Custom',custom:true},o)}));
 var rows=all.map(function(o){var n=nextDate(o);return n&&{o:o,n:n}}).filter(Boolean).sort(function(a,b){return a.n.t-b.n.t});
 rows.slice(0,14).forEach(function(r){var o=r.o,left=Math.round((r.n.t-today())/864e5),c=h('div','o'+(left<=30?' soon':''));
  var t=h('div','tags');t.appendChild(h('span','chip'+(left<=30?' s':''),o.tag));if(o.confirm)t.appendChild(h('span','chip g','To confirm'));if(o.est)t.appendChild(h('span','chip g','Estimated'));c.appendChild(t);
  c.appendChild(h('b',0,o.name));c.appendChild(h('small',0,fd(r.n.d+'T00:00:00+08:00',{weekday:'short'})));
  c.appendChild(h('span','dleft',left===0?'Today':left+(left===1?' day':' days')));
  if(o.note)c.appendChild(h('span','note',o.note));
  if(o.src){var s=h('small',0,o.src+' ');if(o.url){var a=h('a',0,'Source ↗');a.href=o.url;a.target='_blank';a.rel='noopener noreferrer';s.appendChild(a)}c.appendChild(s)}
  var ac=h('div','acts');
  if(o.editable||o.custom){var e=h('button','lk','Edit');e.onclick=function(){openD(o)};ac.appendChild(e)}
  if(o.custom){var x=h('button','lk','Remove');x.onclick=function(){OC.custom=OC.custom.filter(function(z){return z.id!==o.id});save('dd_occ',OC);drawOcc()};ac.appendChild(x)}
  c.appendChild(ac);oc.appendChild(c)})}
function openD(o){dlgO=o||null;$('#on').value=o?o.name:'';$('#od').value=o?(nextDate(o)||{d:o.date||''}).d:'';$('#ot').value=o&&o.note||'';$('#oy').checked=!!(o&&o.yearly);$('#oc').checked=!(o&&o.confirm);$('#dlg').showModal()}
$('#addo').onclick=function(){openD(null)};$('#oq').onclick=function(){$('#dlg').close()};
$('#fm').onsubmit=function(){var v={name:$('#on').value.trim(),date:$('#od').value,note:$('#ot').value.trim(),yearly:$('#oy').checked,confirm:!$('#oc').checked};if(!v.name||!v.date)return;
 if(dlgO&&!dlgO.custom){OC.edits[dlgO.id]=v;delete OC.edits[dlgO.id].md}
 else if(dlgO){OC.custom=OC.custom.map(function(z){return z.id===dlgO.id?Object.assign({id:z.id},v):z})}
 else OC.custom.push(Object.assign({id:'c'+Date.now()},v));save('dd_occ',OC);drawOcc()};
function sc(d){oc.scrollBy({left:d*oc.clientWidth*.8,behavior:'smooth'})}
$('#pv').onclick=function(){sc(-1)};$('#nx').onclick=function(){sc(1)};
oc.onkeydown=function(e){if(e.key==='ArrowRight'){sc(1);e.preventDefault()}if(e.key==='ArrowLeft'){sc(-1);e.preventDefault()}};
function sct(d){$('#trow').scrollBy({left:d*$('#trow').clientWidth*.8,behavior:'smooth'})}$('#tp').onclick=function(){sct(-1)};$('#tn').onclick=function(){sct(1)};
$('#trow').onkeydown=function(e){if(e.key==='ArrowRight'){sct(1);e.preventDefault()}if(e.key==='ArrowLeft'){sct(-1);e.preventDefault()}};
drawOcc();
/* ---- stories ---- */
function ph(a){var p=h('div','ph');p.appendChild(h('i'));p.appendChild(h('span',0,a.c&&a.c[0]||'Story'));return p}
function img(a){if(!a.i)return ph(a);var im=document.createElement('img');im.src=a.i;im.alt='';im.loading='lazy';im.referrerPolicy='no-referrer';im.onerror=function(){im.replaceWith(ph(a))};return im}
function body(a,big){var t=h('div','tx'),g=h('div','tags');(a.c||[]).slice(0,3).forEach(function(c,i){g.appendChild(h('span','chip'+(i?' g':''),c))});
 if(a.cached)g.appendChild(h('span','chip g','Cached'));if(a.hl)g.appendChild(h('span','chip g','Headline only'));t.appendChild(g);
 t.appendChild(h('h3',0,a.t));t.appendChild(h('div','meta',(a.p||a.s)+' · '+fd(a.d)));
 if(a.e)t.appendChild(h('div','meta',a.e));else if(a.hl&&!big)t.appendChild(h('div','meta','Only the headline was available. Open the article for details.'));
 if(a.w){var m=h('div','wm');m.appendChild(h('b',0,'Why it matters: '));m.appendChild(document.createTextNode(a.w));t.appendChild(m)}
 if(a.x){var i=h('div','idea');i.appendChild(h('b',0,'Idea for Donergy: '));i.appendChild(document.createTextNode(a.x+' '));i.appendChild(h('em',0,'(our suggestion, not from the article)'));t.appendChild(i)}
 if(a.rel&&a.rel.length){var d=h('details','rel');d.appendChild(h('summary',0,'Also covered by '+a.rel.length+' other source'+(a.rel.length>1?'s':'')));a.rel.forEach(function(r){var l=h('a',0,r.s+': '+r.t);l.href=r.l;l.target='_blank';l.rel='noopener noreferrer';d.appendChild(l)});t.appendChild(d)}
 var r=h('a','rd','Read article →');r.href=a.l;r.target='_blank';r.rel='noopener noreferrer';t.appendChild(r);return t}
function card(a,big){var c=h(big?'div':'article',big?'feat':'card');
 if(big){c.appendChild(img(a));c.appendChild(body(a,1));return c}
 if(a.i)c.appendChild(img(a));else c.appendChild(ph(a));
 var b=h('button','bm',SAVED[a.l]?'★':'☆');b.setAttribute('aria-pressed',!!SAVED[a.l]);b.setAttribute('aria-label',(SAVED[a.l]?'Unsave: ':'Save: ')+a.t);
 b.onclick=function(){if(SAVED[a.l])delete SAVED[a.l];else SAVED[a.l]=a;save('dd_saved',SAVED);draw()};c.appendChild(b);c.appendChild(body(a));return c}
var F=$('#f'),FL=['All'].concat(D.cats);
FL.concat([D.trends,D.overseas]).forEach(function(k){if(k===D.trends)F.appendChild(h('span','sep'));if(k===D.overseas)F.appendChild(h('span','sep'));var b=h('button','fb'+(k===D.overseas?' os':''),k);b.dataset.k=k;b.onclick=function(){S.cat=k;S.n=30;draw()};F.appendChild(b)});
$('#q').oninput=function(e){S.q=e.target.value.toLowerCase();S.n=30;draw()};
$('#sv').onclick=function(){S.saved=!S.saved;S.n=30;draw()};$('#more').onclick=function(){S.n+=30;draw()};
function inCat(a){var c=a.c||[];if(S.cat==='All')return c.indexOf(D.overseas)<0&&c.indexOf(D.trends)<0;return c.indexOf(S.cat)>-1}
function draw(){
 var pool=S.saved?Object.keys(SAVED).map(function(k){return SAVED[k]}):D.articles;
 var list=pool.filter(function(a){return(S.saved||inCat(a))&&(!S.q||((a.t||'')+' '+(a.p||(/^GNews/.test(a.s||'')?'':a.s)||'')+' '+(a.e||'')).toLowerCase().indexOf(S.q)>-1)});
 var sv=$('#sv');sv.textContent='Saved ('+Object.keys(SAVED).length+')';sv.setAttribute('aria-pressed',S.saved);
 Array.prototype.forEach.call(F.querySelectorAll('.fb'),function(b){b.setAttribute('aria-pressed',b.dataset.k===S.cat)});
 var fb=$('#featbox');fb.innerHTML='';
 var f=!S.saved&&S.cat==='All'&&!S.q&&D.feat&&D.articles.filter(function(a){return a.l===D.feat})[0];
 if(f){fb.appendChild(h('h2',0,D.featLabel));fb.appendChild(card(f,true));list=list.filter(function(a){return a.l!==f.l})}
 var tr=$('#trow');tr.innerHTML='';var tl=D.articles.filter(function(a){return(a.c||[]).indexOf(D.trends)>-1}).slice(0,12);
 if(!tl.length)tr.appendChild(h('p','state','No trends or memes right now. Check the source status above.'));tl.forEach(function(a){tr.appendChild(card(a))});
 var g=$('#grid');g.innerHTML='';
 if(!list.length)g.appendChild(h('p','state',S.saved?'No saved articles yet. Tap the ☆ on a story to save it.':'No stories match. Try a different filter or search.'));
 list.slice(0,S.n).forEach(function(a){g.appendChild(card(a))});$('#more').hidden=list.length<=S.n}
draw();
$('#foot').textContent='Donergy Daily · Saved stories and custom occasions are stored only in this browser · Stories link to their original publishers · Singapore time (SGT)';
})();
</script></body></html>
